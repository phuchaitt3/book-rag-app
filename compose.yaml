services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bookrag
      POSTGRES_PASSWORD: bookrag
      POSTGRES_DB: bookrag
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrag -d bookrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bookrag:bookrag@db:5432/bookrag
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
