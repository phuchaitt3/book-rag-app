services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bookrag
      POSTGRES_PASSWORD: bookrag
      POSTGRES_DB: bookrag
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrag -d bookrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Experiment (ADR 0008, expires 2026-12-15): vector store, used when VECTOR_STORE=qdrant.
  # Reachable on the Compose network only (no published port): Qdrant starts without authentication.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant-data:/qdrant/storage

  # S3-compatible store for uploads. SeaweedFS, because MinIO no longer publishes free images.
  # No auth locally; production uses Cloudflare R2.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

  # One-shot: creates or upgrades the tables, then exits. The api and worker wait for it.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app/apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://bookrag:bookrag@db:5432/bookrag
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bookrag:bookrag@db:5432/bookrag
      CORS_ORIGINS: '["http://localhost:3000"]'
      S3_ENDPOINT_URL: http://s3:8333
      VECTOR_STORE: ${VECTOR_STORE:-pgvector}
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bookrag:bookrag@db:5432/bookrag
      S3_ENDPOINT_URL: http://s3:8333
      # The host's Ollama; set EMBEDDING_PROVIDER=fake to run without a model.
      OLLAMA_URL: http://host.docker.internal:11434
      VECTOR_STORE: ${VECTOR_STORE:-pgvector}
      QDRANT_URL: http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
        - action: sync
          path: ./apps/web/public
          target: /app/apps/web/public
        - action: rebuild
          path: ./apps/web/package.json

volumes:
  db-data:
  qdrant-data:
  s3-data:
