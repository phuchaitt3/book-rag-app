services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bookrag
      POSTGRES_PASSWORD: bookrag
      POSTGRES_DB: bookrag
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrag -d bookrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store for uploads. SeaweedFS, because MinIO no longer publishes free images.
  # No auth locally; production uses Cloudflare R2.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bookrag:bookrag@db:5432/bookrag
      CORS_ORIGINS: '["http://localhost:3000"]'
      S3_ENDPOINT_URL: http://s3:8333
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bookrag:bookrag@db:5432/bookrag
      S3_ENDPOINT_URL: http://s3:8333
      # The host's Ollama; set EMBEDDING_PROVIDER=fake to run without a model.
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
        - action: sync
          path: ./apps/web/public
          target: /app/apps/web/public
        - action: rebuild
          path: ./apps/web/package.json

volumes:
  db-data:
  s3-data:
