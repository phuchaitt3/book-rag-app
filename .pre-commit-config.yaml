# Local hooks run the same tool versions as uv.lock and CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: web-lint
        name: web lint
        entry: pnpm lint:web
        language: system
        files: ^apps/web/
        pass_filenames: false
      - id: web-typecheck
        name: web typecheck
        entry: pnpm typecheck:web
        language: system
        files: ^apps/web/
        pass_filenames: false
