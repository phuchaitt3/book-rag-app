# Local Prometheus for compose.observability.yaml. No credentials.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: book-rag-api
    static_configs:
      # The API's published port on the host (compose.yaml maps 8000 to 8080).
      - targets: ["host.docker.internal:8000"]
