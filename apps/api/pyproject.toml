[project]
name = "book-rag-api"
version = "0.1.0"
description = "FastAPI backend for book-rag-app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "book-rag",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pgvector>=0.3",
    "procrastinate>=3.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
    "boto3>=1.43.122",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_rag_api"]
