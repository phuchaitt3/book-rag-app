name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# No default token access; each job asks for what it needs.
permissions: {}

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload CodeQL results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  images:
    # Builds each image without pushing, scans it with Trivy, and writes an SBOM.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    env:
      IMAGE: book-rag-${{ matrix.image }}:scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and its base, to list what the pull request changed
      # A fix published today must not block a pull request that cannot have caused the finding.
      # The weekly and push runs always gate, so they remain the alarm. A git error counts as changed.
      - name: Check whether the image inputs changed
        id: inputs
        run: |
          inputs=(
            'apps/*/Dockerfile' .dockerignore
            pyproject.toml 'apps/*/pyproject.toml' 'packages/*/pyproject.toml' uv.lock
            package.json 'apps/*/package.json' pnpm-lock.yaml pnpm-workspace.yaml
            .github/workflows/security.yml
          )
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet HEAD^1 HEAD -- "${inputs[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No image input changed; the vulnerability gate is skipped for this pull request."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build (not pushed)
        run: docker build -f apps/${{ matrix.image }}/Dockerfile -t "$IMAGE" .
      - name: Trivy scan, full report as SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "0"
      - name: Upload SARIF to code scanning
        # A token from a fork PR is read-only, so skip the upload there.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
      - name: Gate on fixable CRITICAL vulnerabilities
        if: steps.inputs.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
          exit-code: "0"
      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json

  dependency-review:
    # Runs only when the repository variable DEPENDENCY_GRAPH is 'true'. The action fails until the
    # owner turns on Settings > Advanced Security > Dependency graph; then set the variable
    # (Settings > Secrets and variables > Actions > Variables) and this job starts running on PRs.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high # the action's default is low; matches the code-scanning gate
