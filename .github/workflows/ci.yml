name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff-cover compares against origin/main
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=xml
      # Coverage of changed lines (#302). Warn-only until 2026-12-01: a miss shows as a
      # warning, not a red check. To make it fail: delete the next line
      # (continue-on-error) and the "Warn-only" word in the step name.
      - name: Changed-line coverage floor (Warn-only)
        continue-on-error: true
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
      - run: python scripts/check_sample_sizes.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the generated API types are fresh
        run: |
          pnpm --filter web gen:types
          git diff --exit-code apps/web/src/api || {
            echo "::error::apps/web/src/api is stale; run 'pnpm gen:api' and commit the result"
            exit 1
          }
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm build:web

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: uvx pre-commit run --all-files

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t book-rag-api .
