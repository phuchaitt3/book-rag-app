# Adds the reranker (ADR 0009): Hugging Face TEI serving BAAI/bge-reranker-v2-m3 on an NVIDIA
# Turing GPU (GTX 16xx, RTX 20xx, T4; other generations need another TEI image tag).
#   pnpm stack:up:rerank   (docker compose -f compose.yaml -f compose.reranker.yaml up -d --build)
# Not in compose.yaml because the CPU image took about 58 s per question at depth 20, and fp32
# because fp16 was about 4x slower on a GTX 1660 Ti (both measured 2026-11-10, see
# docs/design/0009-reranker-local-tei-service.md). The model (about 2.2 GB) downloads into the
# tei-models volume on first start; until it is ready, answers use the fused order.
# Compose network only (no published port): TEI starts without authentication.
services:
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.9.4
    command:
      - --model-id=BAAI/bge-reranker-v2-m3
      - --dtype=float32
      # 2048 tokens per batch fits the 6 GB card next to Ollama; longer inputs are cut.
      - --max-batch-tokens=2048
      - --max-client-batch-size=64
    volumes:
      - tei-models:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    environment:
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-tei}
      RERANKER_URL: http://reranker:80

volumes:
  tei-models:
